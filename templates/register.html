{% extends "base.html" %}

{% block title %}Create Account | Rafiki Mkombozi{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 col-sm-10">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <div class="auth-logo" aria-hidden="true">✦</div>
                        <h2 class="fw-bold">Create Your Account</h2>
                        <p class="text-muted">Join Rafiki Mkombozi and access intelligent financial services.</p>
                    </div>

                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Full Name</label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" autocomplete="name" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="example@email.com" autocomplete="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" id="phone" name="phone" class="form-control" placeholder="Enter your phone number" autocomplete="tel" required>
                        </div>

                        <div class="mb-3">
                            <label for="role" class="form-label fw-semibold">Account Type</label>
                            <select id="role" name="role" class="form-select" required>
                                <option value="" selected disabled>Select account type</option>
                                <option value="customer">Customer</option>
                                <option value="bank">Bank</option>
                                <option value="insurer">Insurer</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Create a secure password" autocomplete="new-password" minlength="6" required>
                            <small class="text-muted">Password must contain at least 6 characters.</small>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="terms" required>
                            <label class="form-check-label" for="terms">I agree to the platform terms and acknowledge the use of my information for financial and risk assessment.</label>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2">Create Account</button>
                    </form>

                    <p class="text-center mt-4 mb-0">Already have an account? <a href="{{ url_for('login') }}" class="text-success fw-semibold">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
