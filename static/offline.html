<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#071313">
    <title>Offline | Rafiki Mkombozi</title>
    <style>
        :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; background: #071313; color: #e8f4f1; }
        * { box-sizing: border-box; }
        body { display: grid; min-height: 100vh; min-height: 100svh; margin: 0; padding: 24px; place-items: center; }
        main { width: min(100%, 420px); padding: 28px; border: 1px solid rgba(255,255,255,.12); border-radius: 12px; background: #102322; }
        img { display: block; width: 64px; height: 64px; margin-bottom: 24px; }
        h1 { margin: 0 0 10px; font-size: 24px; }
        p { margin: 0 0 22px; color: #a9c0ba; line-height: 1.55; }
        button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 7px; background: #16a085; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/static/images/pwa-icon-192.png" alt="">
        <h1>You’re offline</h1>
        <p>Reconnect to continue. Account pages and financial records are not available offline.</p>
        <button type="button" id="retry-connection">Try again</button>
    </main>
    <script>
        document.getElementById("retry-connection").addEventListener("click", () => location.reload());
    </script>
</body>
</html>
